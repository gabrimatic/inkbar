name: Bug report
description: Report broken or surprising behavior in Inkbar.
labels: ["bug"]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: One sentence describing what broke.
      placeholder: "The bar does not appear when I select text in my editor."
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The shortest path that reproduces the issue. Say how you selected the text (drag, double-click, Shift and arrow keys).
      placeholder: |
        1. Open the app
        2. Drag across a sentence
        3. Wait one second
        4. No bar appears
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: The expected result.
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What happened instead, with a screenshot if it is visual.
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Inkbar version
      description: Shown in Settings > About.
      placeholder: "1.0.0"
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: macOS version and Mac
      placeholder: "macOS 26.1 on a MacBook Air M3"
    validations:
      required: true

  - type: input
    id: app
    attributes:
      label: App where it happens
      description: The app and its version, if the problem is limited to one app.
      placeholder: "Safari 26, TextEdit, Slack"
    validations:
      required: false

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - The bar does not appear
        - Placement or size
        - An action (Copy, Search, Translate, and so on)
        - Apple Intelligence
        - Translate
        - Settings or Welcome window
        - Permissions
        - Shortcuts, Focus or Control Center
        - Other
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: |
        Output of this command run in Terminal right after the problem. Inkbar never logs selected text, but check before you paste.
        `log show --last 5m --predicate 'subsystem == "info.gabrimatic.inkbar"' --info`
      render: shell
    validations:
      required: false

  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Anything else that helps with triage.
    validations:
      required: false
